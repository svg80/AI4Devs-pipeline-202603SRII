name: Pipeline

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
  push:
    branches: [feature/*]

env:
  NODE_VERSION: '18'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Run backend tests
        run: cd backend && npm test

  build-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build backend
        run: cd backend && npm run build
      - name: Cache backend dist
        uses: actions/cache@v5
        with:
          path: backend/dist
          key: ${{ runner.os }}-backend-dist-${{ github.sha }}

  deploy-backend:
    if: github.ref == 'refs/heads/main'
    needs: build-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore backend dist
        uses: actions/cache@v5
        with:
          path: backend/dist
          key: ${{ runner.os }}-backend-dist-${{ github.sha }}
      - name: Setup SSH key
        run: |
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem
      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync
      - name: Sync backend files to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i private_key.pem -o StrictHostKeyChecking=no" \
            backend/dist/ backend/package.json backend/package-lock.json \
            ec2-user@${{ secrets.EC2_INSTANCE }}:~/app/backend/
      - name: Setup infrastructure and deploy on EC2
        run: |
          ssh -i private_key.pem -o StrictHostKeyChecking=no \
            ec2-user@${{ secrets.EC2_INSTANCE }} << 'EOF'
            # Install Node via nvm
            export NVM_DIR="$HOME/.nvm"
            if [ ! -d "$NVM_DIR" ]; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            fi
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            command -v node &> /dev/null || nvm install --lts

            # Install PM2
            if ! command -v pm2 &> /dev/null; then
              npm install -g pm2
            fi

            # Install nginx
            if ! command -v nginx &> /dev/null; then
              sudo yum update -y
              sudo yum install -y nginx
            fi

            # Configure nginx as reverse proxy to port 3010
            sudo mkdir -p /etc/nginx/conf.d
            echo 'server {
              listen 80;
              server_name _;
              location / {
                proxy_pass http://localhost:3010;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }' | sudo tee /etc/nginx/conf.d/app.conf > /dev/null
            sudo systemctl enable --now nginx

            # Install production dependencies and start the app
            cd ~/app/backend
            npm ci --production
            pm2 stop all || true
            pm2 start dist/index.js --name "backend-app" -- --port 3010
          EOF
      - name: Cleanup SSH key
        if: always()
        run: rm -f private_key.pem
